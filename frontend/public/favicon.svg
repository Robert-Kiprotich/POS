<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Bright Light Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>

    <!-- Sun Sunrise Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>

    <!-- Golden Ring & Path Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Vibrant Green Hills Gradient -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>

  <!-- Bright Rounded Favicon Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Emblem Border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="18"/>

  <!-- Sun -->
  <circle cx="256" cy="180" r="85" fill="url(#sunGrad)"/>

  <!-- Background Hills -->
  <path d="M 60 280 Q 170 210 280 260 Q 380 220 452 280 A 210 210 0 0 1 458 320 Q 350 280 256 310 Q 150 280 54 320 A 210 210 0 0 1 60 280 Z" fill="url(#hillGrad)"/>

  <!-- Winding Golden Path -->
  <path d="M 256 300 Q 210 350 280 400 Q 210 440 210 466 A 210 210 0 0 0 302 462 Q 310 420 230 380 Q 290 330 256 300 Z" fill="url(#goldGrad)"/>

  <!-- Foreground Leaf Accent -->
  <path d="M 340 230 C 370 170 430 180 430 180 C 430 180 420 230 370 240 C 350 244 340 230 340 230 Z" fill="#A5D6A7"/>
  <path d="M 370 240 C 400 210 450 230 450 230 C 450 230 430 270 390 265 Z" fill="#66BB6A"/>

  <!-- Animal Silhouettes Accent (Simplified for high visibility) -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Cow Silhouette -->
    <path d="M 140 210 Q 130 180 150 170 Q 165 175 170 160 Q 185 165 195 180 Q 210 185 215 205 Q 180 225 140 210 Z"/>
    <!-- Rooster Accent -->
    <path d="M 210 220 Q 215 200 225 195 Q 235 205 230 225 Z" fill="#FF7043"/>
    <!-- Sheep / Goat Accent -->
    <path d="M 230 215 Q 245 190 265 200 Q 275 215 260 235 Z"/>
  </g>
</svg>
